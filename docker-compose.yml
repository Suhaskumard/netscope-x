# Phase 06 development compose file: backend + frontend dev containers only.
# The multi-tier network laboratory (client/gateway/LB/API/cache/DB/worker/DNS/
# external-service simulator) is a separate concern introduced in Phase 11
# (simulator/docker/) and is NOT this file.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    environment:
      # frontend/vite.config.ts's /api proxy defaults to 127.0.0.1:8000, which inside this container is itself,
      # not the backend service -- found during the Docker validation pass (GET /api/... returned 500).
      NETSCOPE_API_TARGET: http://backend:8000
    depends_on:
      - backend
