events {}

http {
    # Phase 13 -- Routing Laboratory: two real routes from gateway into the
    # app tier (was a single proxy_pass to one load-balancer). nginx's
    # default upstream behavior round-robins across both, and automatically
    # fails over to the surviving one if a peer becomes unreachable -- a
    # real, observable controlled routing change, not a declared one.
    upstream load_balancers {
        server load-balancer:80;
        server load-balancer-2:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://load_balancers;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            add_header X-Gateway-Upstream $upstream_addr always;
        }
    }
}
