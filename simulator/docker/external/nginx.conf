events {}

http {
    server {
        listen 80;
        root /usr/share/nginx/html;
    }

    # Phase 15 -- TLS metadata generation target. Self-signed, lab-only
    # certificate generated at container startup (see docker-compose.yml's
    # command for external-service). Never a production TLS pattern.
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        root /usr/share/nginx/html;
    }
}
