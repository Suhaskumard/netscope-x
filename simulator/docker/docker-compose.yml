# NETSCOPE-X Multi-Tier Network Laboratory (spec Phase 11, network
# boundaries added in Phase 12, route redundancy added in Phase 13 -- see
# docs/architecture/network_laboratory.md for the full rationale of each;
# these are documented, in-place modifications of the Phase 11 lab, not
# silent architecture changes, per spec §38).
#
# Separate from the repo-root docker-compose.yml (Phase 06 dev environment
# for the backend/frontend placeholder app) -- this is the controlled lab
# NETSCOPE-X will eventually observe traffic on. 10 required service ROLES
# (client, gateway, load-balancer, api-1, api-2, redis, database, worker,
# dns, external-service) segmented across 4 networks (edge/app/data/
# external), plus a second load-balancer instance (Phase 13) giving the
# gateway->app-tier hop two real, independently-controllable routes.
#
# Run:  docker compose -f simulator/docker/docker-compose.yml up -d
# Stop: docker compose -f simulator/docker/docker-compose.yml down
services:
  client:
    image: alpine:3.20
    # python3 added in Phase 14 so `client` can also run the reproducible
    # traffic generator (simulator/traffic/) against the lab -- it already
    # had curl/bind-tools from Phase 11 for connectivity verification.
    command: sh -c "apk add --no-cache curl bind-tools python3 >/dev/null && sleep infinity"
    volumes:
      - ..:/opt/netscope/simulator:ro
    working_dir: /opt/netscope
    environment:
      PYTHONPATH: /opt/netscope
    networks: [edge]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [load-balancer, load-balancer-2]
    networks: [edge, app]

  load-balancer:
    image: nginx:1.27-alpine
    volumes:
      - ./load_balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-1, api-2]
    networks: [app]

  load-balancer-2:
    image: nginx:1.27-alpine
    volumes:
      - ./load_balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-1, api-2]
    networks: [app]

  api-1:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./api/api.py:/app/api.py:ro
    environment:
      APP_NAME: api-1
      REDIS_HOST: redis
      DATABASE_HOST: database
      EXTERNAL_URL: http://external-service/
    command: python api.py
    depends_on:
      redis: { condition: service_healthy }
      database: { condition: service_healthy }
      external-service: { condition: service_started }
    networks: [app, data, external]

  api-2:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./api/api.py:/app/api.py:ro
    environment:
      APP_NAME: api-2
      REDIS_HOST: redis
      DATABASE_HOST: database
      EXTERNAL_URL: http://external-service/
    command: python api.py
    depends_on:
      redis: { condition: service_healthy }
      database: { condition: service_healthy }
      external-service: { condition: service_started }
    networks: [app, data, external]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [data]

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: netscope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [data]

  worker:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./worker/worker.py:/app/worker.py:ro
    environment:
      REDIS_HOST: redis
      DATABASE_HOST: database
      WORKER_INTERVAL_SECONDS: "5"
    command: python worker.py
    depends_on:
      redis: { condition: service_healthy }
      database: { condition: service_healthy }
    networks: [app, data]

  dns:
    image: alpine:3.20
    command: sh -c "apk add --no-cache dnsmasq >/dev/null && dnsmasq -k -C /etc/dnsmasq.conf"
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add: [NET_ADMIN]
    networks: [edge]

  external-service:
    image: nginx:1.27-alpine
    volumes:
      - ./external/index.html:/usr/share/nginx/html/index.html:ro
    networks: [external]

networks:
  edge:
    name: netscope-x-lab-edge
  app:
    name: netscope-x-lab-app
  data:
    name: netscope-x-lab-data
  external:
    name: netscope-x-lab-external
