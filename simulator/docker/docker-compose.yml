# NETSCOPE-X Multi-Tier Network Laboratory (spec Phase 11, network
# boundaries added in Phase 12, route redundancy added in Phase 13 -- see
# docs/architecture/network_laboratory.md for the full rationale of each;
# these are documented, in-place modifications of the Phase 11 lab, not
# silent architecture changes, per spec §38).
#
# Separate from the repo-root docker-compose.yml (Phase 06 dev environment
# for the backend/frontend placeholder app) -- this is the controlled lab
# NETSCOPE-X will eventually observe traffic on. 10 required service ROLES
# (client, gateway, load-balancer, api-1, api-2, redis, database, worker,
# dns, external-service) segmented across 4 networks (edge/app/data/
# external), plus a second load-balancer instance (Phase 13) giving the
# gateway->app-tier hop two real, independently-controllable routes.
#
# Run:  docker compose -f simulator/docker/docker-compose.yml up -d
# Stop: docker compose -f simulator/docker/docker-compose.yml down
services:
  client:
    image: alpine:3.20
    # python3 added in Phase 14 so `client` can also run the reproducible
    # traffic generator (simulator/traffic/) against the lab -- it already
    # had curl/bind-tools from Phase 11 for connectivity verification.
    # py3-pip/libpcap + cap_add added in Phase 21 so `client` can also run
    # simulator/capture/live.py's real Scapy sniff() against its own
    # edge-network interface -- raw-socket capture needs CAP_NET_RAW, and
    # Scapy's libpcap-backed sniffer needs CAP_NET_ADMIN to set promiscuous
    # mode; no other container is granted this (spec §5 Safety Boundary --
    # capture stays scoped to one authorized, documented vantage point).
    command: sh -c "apk add --no-cache curl bind-tools python3 py3-pip libpcap-dev >/dev/null && pip install --no-cache-dir --break-system-packages scapy==2.6.1 >/dev/null && sleep infinity"
    volumes:
      - ..:/opt/netscope/simulator:ro
      # backend/nettrace/capture/{authorized_interfaces,errors}.py are
      # stdlib-only (no Pydantic/FastAPI) specifically so simulator/capture/
      # live.py can import them here without installing the backend's full
      # dependency stack in this lab container -- just this one directory.
      - ../../backend:/opt/netscope/backend:ro
    working_dir: /opt/netscope
    environment:
      PYTHONPATH: /opt/netscope
    cap_add: [NET_RAW, NET_ADMIN]
    networks: [edge]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [load-balancer, load-balancer-2]
    networks: [edge, app]

  load-balancer:
    image: nginx:1.27-alpine
    volumes:
      - ./load_balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-1, api-2]
    networks: [app]

  load-balancer-2:
    image: nginx:1.27-alpine
    volumes:
      - ./load_balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-1, api-2]
    networks: [app]

  api-1:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./api/api.py:/app/api.py:ro
      # Phase 15 -- api-1 doubles as the runner for protocol-diverse traffic
      # generation (cache/database/TLS targets), since it's the only role
      # that legitimately reaches app+data+external per Phase 12's segmentation.
      - ..:/opt/netscope/simulator:ro
    environment:
      APP_NAME: api-1
      REDIS_HOST: redis
      DATABASE_HOST: database
      EXTERNAL_URL: http://external-service/
      PYTHONPATH: /opt/netscope
    command: python api.py
    depends_on:
      redis: { condition: service_healthy }
      database: { condition: service_healthy }
      external-service: { condition: service_started }
    networks: [app, data, external]

  api-2:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./api/api.py:/app/api.py:ro
    environment:
      APP_NAME: api-2
      REDIS_HOST: redis
      DATABASE_HOST: database
      EXTERNAL_URL: http://external-service/
    command: python api.py
    depends_on:
      redis: { condition: service_healthy }
      database: { condition: service_healthy }
      external-service: { condition: service_started }
    networks: [app, data, external]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [data]

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: netscope
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [data]

  worker:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./worker/worker.py:/app/worker.py:ro
    environment:
      REDIS_HOST: redis
      DATABASE_HOST: database
      WORKER_INTERVAL_SECONDS: "5"
    command: python worker.py
    depends_on:
      redis: { condition: service_healthy }
      database: { condition: service_healthy }
    networks: [app, data]

  dns:
    image: alpine:3.20
    command: sh -c "apk add --no-cache dnsmasq >/dev/null && dnsmasq -k -C /etc/dnsmasq.conf"
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add: [NET_ADMIN]
    networks: [edge]

  external-service:
    image: nginx:1.27-alpine
    # Phase 15 -- generates a self-signed, lab-only TLS certificate at startup
    # so this service can also act as the TLS-handshake / TLS-metadata target
    # (docs/architecture/protocol_generation.md). Never a production pattern.
    command: sh -c "apk add --no-cache openssl >/dev/null && mkdir -p /etc/nginx/tls && openssl req -x509 -nodes -newkey rsa:2048 -keyout /etc/nginx/tls/key.pem -out /etc/nginx/tls/cert.pem -days 1 -subj '/CN=external-service.lab' >/dev/null 2>&1 && nginx -g 'daemon off;'"
    volumes:
      - ./external/index.html:/usr/share/nginx/html/index.html:ro
      - ./external/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [external]

networks:
  edge:
    name: netscope-x-lab-edge
  app:
    name: netscope-x-lab-app
  data:
    name: netscope-x-lab-data
  external:
    name: netscope-x-lab-external
